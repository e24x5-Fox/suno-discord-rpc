<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno → Discord RPC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      background: #0d0d0f;
      color: #e8e8e8;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 14px 16px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #5865f2, #eb459e);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .header-text h1 { font-size: 13px; font-weight: 700; color: #fff; }
    .header-text p { font-size: 10px; color: #888; margin-top: 2px; }

    /* STATUS */
    .status-section {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1a1a;
    }
    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .status-label { color: #666; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

    .badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .badge.connected    { background: #1a3a1a; color: #3ba55d; border: 1px solid #3ba55d44; }
    .badge.disconnected { background: #3a1a1a; color: #ed4245; border: 1px solid #ed424544; }
    .badge.playing      { background: #1a2a3a; color: #5865f2; border: 1px solid #5865f244; }
    .badge.paused       { background: #2a2a1a; color: #faa61a; border: 1px solid #faa61a44; }
    .badge.idle         { background: #1a1a1a; color: #666;    border: 1px solid #333; }

    .track-section { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; }
    .cover-row { display: flex; gap: 10px; align-items: flex-start; }
    .cover {
      width: 48px; height: 48px; border-radius: 6px;
      background: #1a1a1a; flex-shrink: 0;
      object-fit: cover; border: 1px solid #222;
    }
    .cover-placeholder {
      width: 48px; height: 48px; border-radius: 6px;
      background: #1a1a2e; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; border: 1px solid #222;
    }
    .track-info { flex: 1; min-width: 0; }
    .track-title { font-weight: 700; font-size: 12px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 10px; color: #888; margin-top: 3px; }
    .progress-bar { margin-top: 8px; height: 3px; background: #222; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #5865f2, #eb459e); border-radius: 2px; transition: width 1s linear; width: 0%; }
    .time-row { display: flex; justify-content: space-between; margin-top: 4px; color: #555; font-size: 9px; }
    .no-track { padding: 20px 16px; text-align: center; color: #444; }
    .no-track-icon { font-size: 28px; margin-bottom: 8px; }
    .no-track p { font-size: 10px; line-height: 1.6; }

    .footer {
      padding: 10px 16px;
      color: #444; font-size: 9px; line-height: 1.6;
      border-top: 1px solid #111;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">♪</div>
    <div class="header-text">
      <h1>Suno → Discord</h1>
      <p>Rich Presence Bridge</p>
    </div>
  </div>

  <div class="status-section">
    <div class="status-row">
      <span class="status-label">Python сервер</span>
      <span class="badge disconnected" id="server-status">Не подключён</span>
    </div>
    <div class="status-row">
      <span class="status-label">Плеер Suno</span>
      <span class="badge idle" id="player-status">Ожидание</span>
    </div>
  </div>
  <div id="track-container">
    <div class="no-track">
      <div class="no-track-icon">🎵</div>
      <p>Открой suno.com<br>и начни воспроизведение</p>
    </div>
  </div>
  <div class="footer">
    Запусти <strong>suno_rpc.py</strong> перед использованием.
  </div>

  <script src="popup.js"></script>
</body>
</html>
