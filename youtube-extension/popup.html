<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>YouTube → Discord RPC</title>
<style>
  :root{
    --bg:#0e0e10; --bg2:#18181b; --bg3:#27272a;
    --text:#f4f4f5; --text2:#a1a1aa; --text3:#52525b;
    --red:#ff0033; --green:#22c55e;
  }
  *{box-sizing:border-box;}
  body{
    width:300px; margin:0; padding:14px;
    background:var(--bg); color:var(--text);
    font-family:"Cascadia Code","Consolas",monospace; font-size:12px;
  }
  h1{
    margin:0 0 12px; font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--red);
  }
  .card{
    background:var(--bg2); border:1px solid var(--bg3);
    border-radius:8px; padding:10px 12px; margin-bottom:10px;
  }
  .title{font-weight:700; margin-bottom:3px; word-break:break-word;}
  .channel{color:var(--text2); margin-bottom:8px; word-break:break-word;}
  .bar{height:3px; background:var(--bg3); border-radius:2px; overflow:hidden;}
  .bar span{display:block; height:100%; width:0; background:var(--red);}
  .time{margin-top:5px; text-align:right; color:var(--text3); font-size:11px;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:3px 0;}
  .row b{font-weight:400; color:var(--text2);}
  .val{color:var(--text3);}
  .val.ok{color:var(--green);}
  .val.on{color:var(--red);}
  .note{color:var(--text3); font-size:11px; line-height:1.5; margin-top:4px;}
</style>
</head>
<body>
<h1>YouTube → Discord</h1>

<div class="card">
  <div class="title" id="title">Видео не найдено</div>
  <div class="channel" id="channel">—</div>
  <div class="bar"><span id="fill"></span></div>
  <div class="time" id="time">0:00 / 0:00</div>
</div>

<div class="card">
  <div class="row"><b>Сервер</b><span class="val" id="conn">не подключён</span></div>
  <div class="row"><b>Вкладок YouTube</b><span class="val" id="tabs">0</span></div>
  <div class="row"><b>Состояние</b><span class="val" id="play">—</span></div>
</div>

<div class="note">
  Видео показывается в Discord, только когда в Suno ничего не играет —
  музыка всегда в приоритете.
</div>

<script src="popup.js"></script>
</body>
</html>
